name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  brew-check:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check Ruby syntax
        run: ruby -c Casks/flowwatch.rb

      - name: Tap local repository
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/w1tfzqq08ptv"
          ln -s "$PWD" "$(brew --repository)/Library/Taps/w1tfzqq08ptv/homebrew-flowwatch"

      - name: Trust FlowWatch cask
        run: brew trust --cask w1tfzqq08ptv/flowwatch/flowwatch

      - name: Check cask info
        run: brew info --cask w1tfzqq08ptv/flowwatch/flowwatch

      - name: Audit cask
        run: brew audit --cask w1tfzqq08ptv/flowwatch/flowwatch
